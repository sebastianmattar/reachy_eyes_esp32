[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reachy-eyes"
version = "0.1.0"
description = "Python SDK for the Reachy Mini ESP32 eyes (serial protocol client)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

# The head-follow bridge is the only part that talks to the robot.
[project.optional-dependencies]
bridge = ["reachy-mini", "numpy", "scipy"]

[tool.hatch.build.targets.wheel]
packages = ["reachy_eyes"]
