; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
lib_deps =
    lovyan03/LovyanGFX
    bitbank2/AnimatedGIF@^2.1.0
monitor_speed = 115200
upload_speed = 115200 # if flaky use 460800
; Custom partition table: dual OTA app slots (for serial OTA) + a LittleFS data
; partition for the stored gif.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Exclude the SDL2 simulator entry point – it only builds for native_sim.
build_src_filter = +<*> -<sim/*>

; ─── Native macOS simulator ───────────────────────────────────────────────────
; Prerequisites: brew install sdl2
; Build:  pio run -e native_sim
; Run:    .pio/build/native_sim/program
[env:native_sim]
platform = native
; sim_extra.py prepends sim/ to the include path (handles project dirs with spaces).
extra_scripts = pre:sim/sim_extra.py
; AnimatedGIF is portable C (no Arduino dep when ARDUINO is undefined), so the gif
; decoder runs natively too. lib_compat_mode=off lets the native platform accept it.
lib_deps = bitbank2/AnimatedGIF@^2.1.0
lib_compat_mode = off
build_flags =
    -std=c++17
    ; SDL2 — covers both Apple-Silicon (/opt/homebrew) and Intel (/usr/local) Macs.
    -I/opt/homebrew/include
    -I/usr/local/include
    -L/opt/homebrew/lib
    -L/usr/local/lib
    -lSDL2
    -DSIMULATOR
; Build everything under src/, including src/sim/main_sim.cpp — it provides
; main(), simDisplayPush(), and serial injection. The hardware-only calls in the
; shared sources resolve to the no-op stubs in sim/.
build_src_filter =
    +<*>